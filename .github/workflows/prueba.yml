name: Probar acordes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar prueba
        run: gcc -std=c11 -Wall -Wextra -Werror pad_harmony.c test_harmony.c -o test_harmony

      - name: Probar acordes
        run: ./test_harmony
